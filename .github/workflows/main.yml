name: Build Flutter APK

on:
  push:
    branches: [ "ana", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Rename kütüphane to lib if needed
        run: |
          if [ -d "kütüphane" ] && [ ! -d "lib" ]; then
            mv kütüphane lib
          fi

      - name: Create pubspec.yaml if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "name: koyu_mavi" > pubspec.yaml
            echo "description: A new Flutter project." >> pubspec.yaml
            echo "publish_to: 'none'" >> pubspec.yaml
            echo "version: 1.0.0+1" >> pubspec.yaml
            echo "environment:" >> pubspec.yaml
            echo "  sdk: '>=3.0.0 <4.0.0'" >> pubspec.yaml
            echo "dependencies:" >> pubspec.yaml
            echo "  flutter:" >> pubspec.yaml
            echo "    sdk: flutter" >> pubspec.yaml
            echo "  google_fonts: ^6.1.0" >> pubspec.yaml
            echo "  provider: ^6.1.1" >> pubspec.yaml
            echo "flutter:" >> pubspec.yaml
            echo "  uses-material-design: true" >> pubspec.yaml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
